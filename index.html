<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0fae85">
<title>Tr Craze Music</title>
<meta property="og:title" content="Tr Craze Music">
<meta property="og:description" content="Listen to Tr Craze Music">
<style>
  :root {
    --green: #0fae85;
    --green-dark: #0b8a6a;
    --bg: #161616;
    --row: #232323;
    --line: #2c2c2c;
    --text: #f4f4f4;
    --muted: #8b8b8b;
    --danger: #ff8a7a;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 24px; height: 24px; fill: currentColor; display: block; }
  button:focus-visible, .row:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---- layout: full screen on phones, a phone-sized frame on desktop ---- */
  .stage { height: 100%; display: grid; place-items: center; }
  .app {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
    background: var(--bg);
    position: relative; overflow: hidden;
  }
  @media (min-width: 700px) {
    body {
      background:
        radial-gradient(circle at 50% 50%, #0d4a3b 0 22%, transparent 22.2%),
        radial-gradient(circle at 50% 50%, #0f2b25 0 40%, transparent 40.2%),
        radial-gradient(circle at 50% 50%, #131a19 0 62%, #0e0e0e 62.2%);
    }
    .app {
      width: 430px; height: min(860px, calc(100vh - 40px));
      border-radius: 36px; border: 6px solid #0a0a0a;
      box-shadow: 0 0 0 1px #2a2a2a, 0 30px 80px rgba(0,0,0,.6);
    }
  }

  /* ---- top bar ---- */
  .top {
    background: var(--green); color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 12px;
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
  }
  .top h1 { font-size: 1.1rem; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top button { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
  .top button[hidden] { display: block; visibility: hidden; }

  /* ---- views ---- */
  main { overflow-y: auto; overscroll-behavior: contain; }
  .view[hidden] { display: none; }
  .pad { padding: 14px 14px 20px; }

  .shortcuts { display: grid; gap: 8px; margin-bottom: 18px; }
  .shortcut {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--row); border-radius: 10px; padding: 13px 14px; font-size: .95rem;
  }
  .shortcut svg { width: 20px; height: 20px; color: var(--muted); }
  .shortcut .count { margin-left: auto; color: var(--muted); font-size: .85rem; }

  h2.sec { font-size: 1.25rem; font-weight: 700; margin: 6px 2px 8px; }

  .hero {
    position: relative; border-radius: 12px; overflow: hidden; margin-bottom: 12px;
    aspect-ratio: 16 / 10;
    background: linear-gradient(140deg, #0fae85 0%, #0a5a47 55%, #101c19 100%);
    display: flex; align-items: flex-end; padding: 16px;
  }
  .hero::after {
    content: ""; position: absolute; right: -40px; top: -40px; width: 220px; height: 220px; border-radius: 50%;
    background: repeating-radial-gradient(circle, rgba(0,0,0,.18) 0 3px, rgba(255,255,255,.04) 3px 6px);
  }
  .hero h3 { font-size: 1.8rem; line-height: 1.05; position: relative; z-index: 1; }
  .hero p { font-size: .8rem; opacity: .8; margin-top: 4px; position: relative; z-index: 1; }
  .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .btn {
    background: var(--green); color: #fff; border-radius: 8px; height: 42px;
    display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: .9rem;
  }
  .btn svg { width: 20px; height: 20px; }
  .btn:active { background: var(--green-dark); }

  /* ---- track rows ---- */
  ul { list-style: none; padding: 0; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 9px 4px; cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .row:active { background: rgba(255,255,255,.05); }
  .cv {
    flex: none; width: 46px; height: 46px; border-radius: 8px; background-size: cover; background-position: center;
    display: grid; place-items: center; font-weight: 700; font-size: 1rem; color: rgba(255,255,255,.9);
  }
  .cv.big { width: min(72vw, 300px); height: min(72vw, 300px); max-height: 38vh; aspect-ratio: 1; font-size: 4rem; border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .cv.mini { width: 40px; height: 40px; font-size: .9rem; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { display: block; color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .row.active .t b { color: var(--green); }
  .row .fav { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); flex: none; border-radius: 50%; }
  .row .fav svg { width: 22px; height: 22px; }
  .row .fav.on { color: var(--green); }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; font-size: .95rem; }

  /* ---- search ---- */
  .search {
    width: 100%; height: 42px; border: 0; border-radius: 8px; padding: 0 14px; margin-bottom: 10px;
    background: var(--green); color: #fff; font: inherit; font-size: .95rem;
  }
  .search::placeholder { color: rgba(255,255,255,.75); }

  /* ---- full player ---- */
  #v-player .pad { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 22px; }
  .pinfo { width: 100%; display: flex; align-items: center; gap: 10px; }
  .pinfo .t { flex: 1; min-width: 0; }
  .pinfo h2 { font-size: 1.3rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pinfo p { color: var(--muted); font-size: .9rem; margin-top: 3px; }
  .pinfo .fav { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; }
  .pinfo .fav.on { color: var(--green); }
  .seekwrap { width: 100%; }
  input[type=range] { width: 100%; accent-color: var(--green); cursor: pointer; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: .78rem; margin-top: 2px; }
  .ctrls { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 340px; }
  .ctrls button { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; color: var(--text); }
  .ctrls .sm { color: var(--muted); }
  .ctrls .sm.on { color: var(--green); }
  .ctrls .rep.one::after { content: "1"; position: absolute; font-size: .6rem; font-weight: 700; margin-top: 1px; }
  .ctrls .main { width: 68px; height: 68px; background: var(--green); color: #fff; }
  .ctrls .main svg { width: 32px; height: 32px; }
  .vol { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 340px; color: var(--muted); }
  .vol svg { width: 18px; height: 18px; flex: none; }

  /* ---- mini player + tabs ---- */
  .toast { background: #3a1f1b; color: var(--danger); font-size: .8rem; padding: 8px 14px; word-break: break-word; }
  .toast[hidden] { display: none; }
  .mini { background: #202020; border-top: 1px solid var(--line); position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; cursor: pointer; }
  .mini .bar { position: absolute; left: 0; top: 0; height: 2px; width: 0; background: var(--green); }
  .mini .t { flex: 1; min-width: 0; }
  .mini .t b { display: block; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .t span { display: block; font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini button { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
  .mini .mplay { background: var(--green); color: #fff; }
  .tabs {
    display: grid; grid-template-columns: repeat(4, 1fr); background: #111; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tabs button { padding: 9px 0 8px; display: grid; justify-items: center; gap: 3px; color: var(--muted); font-size: .68rem; }
  .tabs button[aria-current="page"] { color: var(--green); }
  .tabs svg { width: 22px; height: 22px; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="stage">
<div class="app" id="app">

  <header class="top">
    <button id="back" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
    <h1 id="ttl">Tr Craze Music</h1>
    <button id="hsearch" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
  </header>

  <main id="main">
    <!-- HOME -->
    <section class="view pad" id="v-home">
      <div class="hero"><div><h3>TR Craze</h3><p id="heroCount"></p></div></div>
      <div class="btnrow">
        <button class="btn" id="playAll"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Play</button>
        <button class="btn" id="shuffleAll"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>Shuffle</button>
      </div>
      <div class="shortcuts">
        <button class="shortcut" id="goFav"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>Favorite songs<span class="count" id="favCount"></span></button>
      </div>
      <h2 class="sec">All songs</h2>
      <ul id="list-home"></ul>
    </section>

    <!-- SEARCH -->
    <section class="view pad" id="v-search" hidden>
      <input class="search" id="q" type="search" placeholder="Search songs" autocomplete="off" aria-label="Search songs">
      <ul id="list-search"></ul>
    </section>

    <!-- FAVORITES -->
    <section class="view pad" id="v-fav" hidden>
      <h2 class="sec">Favorite songs</h2>
      <ul id="list-fav"></ul>
    </section>

    <!-- NOW PLAYING -->
    <section class="view" id="v-player" hidden>
      <div class="pad">
        <div id="bigcover"></div>
        <div class="pinfo">
          <div class="t"><h2 id="ptitle"></h2><p id="partist"></p></div>
          <button class="fav" id="pfav" aria-label="Favorite"></button>
        </div>
        <div class="seekwrap">
          <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
          <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        </div>
        <div class="ctrls">
          <button class="sm" id="shuf" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
          <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
          <button class="main" id="toggle" aria-label="Play"><svg viewBox="0 0 24 24"><path class="ic" d="M8 5v14l11-7z"/></svg></button>
          <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></svg></button>
          <button class="sm rep" id="rep" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="alert" hidden></div>

  <div class="mini" id="mini">
    <div class="bar" id="mbar"></div>
    <div id="mcover"></div>
    <div class="t"><b id="mtitle"></b><span id="martist"></span></div>
    <button id="mprev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="mplay" id="mtoggle" aria-label="Play"><svg viewBox="0 0 24 24"><path class="ic" d="M8 5v14l11-7z"/></svg></button>
    <button id="mnext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></svg></button>
  </div>

  <nav class="tabs" aria-label="Main">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</button>
    <button data-tab="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>Search</button>
    <button data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>Favorites</button>
    <button data-tab="player"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>Playing</button>
  </nav>
</div>
</div>
<audio id="audio" preload="metadata"></audio>

<script>
  // To add a song: upload the file into the "audio" folder, then add one line here.
  var TRACKS = [
    { title: "Bake Wang",                 artist: "TR Craze",                          src: "audio/bake-wang.m4a" },
    { title: "Bulek Ke3 (Junub Sudan)",   artist: "Bulek Ke3 ft. TR Craze",            src: "audio/bulek-ke3.m4a" },
    { title: "Bad News",                  artist: "Lakal 23 x TR Craze",               src: "audio/bad-news.mp3" },
    { title: "Ngath Rodu",                artist: "TR Craze & Lakal 23",               src: "audio/ngath-rodu.m4a" },
    { title: "Madman",                    artist: "TR Craze ft. Jay Hot",              src: "audio/madman.m4a" },
    { title: "Jalä Kä Roda",              artist: "TR Craze",                          src: "audio/jala-ka-roda.mp3" },
    { title: "Jongo",                     artist: "TR Craze",                          src: "audio/jongo.mp3" },
    { title: "Tier Nyakuon",              artist: "TR Craze",                          src: "audio/tier-myakuon.mp3" },
    { title: "Tule Tule",                 artist: "TR Craze",                          src: "audio/tule-tule.mp3" },
    { title: "MAMA",                      artist: "TR Craze",                          src: "audio/mama.mp3" },
    { title: "Bol Brown (Bol in Doär Diss)", artist: "TR Craze",                       src: "audio/bol-brown.m4a" },
    { title: "Broke N_gga",               artist: "TR Craze",                          src: "audio/broke.mp3" },
    { title: "CI Nëëy Pööd",              artist: "TR Craze",                          src: "audio/ci-neey-pood.mp3" },
    { title: "Don't Run",                 artist: "TR Craze, Jøe Malø x KGS",          src: "audio/dont-run.mp3" },
    { title: "Gari Gari",                 artist: "TR Craze",                          src: "audio/gari-gari.m4a" },
    { title: "Mar Rom",                   artist: "TR Craze",                          src: "audio/mar-rom.mp3" },
    { title: "Studio Freestyle",          artist: "TR Craze",                          src: "audio/studio-freestyle.mp3" },
    { title: "Cako Cuuc",                 artist: "TR Craze x Jalo Jay",               src: "audio/cako-cuuc.mp3" },
    { title: "Riet Ti Gow",               artist: "TR Craze x Lakal 23",               src: "audio/riet-ti-gow.mp3" }
  ];


  var $ = function (id) { return document.getElementById(id); };
  var audio = $("audio");
  var ALL = TRACKS.map(function (_, i) { return i; });
  var queue = ALL.slice();
  var cur = 0, shuffle = false, repeat = "all", started = false;
  var tab = "home", prevTab = "home";
  var favs = [];
  var HEART = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";
  var HEART_O = "M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z";
  var PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zM14 5h4v14h-4z";
  var TITLES = { home: "Tr Craze Music", search: "Search", fav: "Favorites", player: "Now playing" };

  /* favorites are saved in the visitor's own browser */
  try { favs = JSON.parse(localStorage.getItem("trcraze_favs") || "[]"); } catch (e) { favs = []; }
  function saveFavs() { try { localStorage.setItem("trcraze_favs", JSON.stringify(favs)); } catch (e) {} }
  function isFav(i) { return favs.indexOf(TRACKS[i].src) !== -1; }
  function toggleFav(i) {
    var k = favs.indexOf(TRACKS[i].src);
    if (k === -1) favs.push(TRACKS[i].src); else favs.splice(k, 1);
    saveFavs(); renderAll();
  }
  function favIndexes() { return ALL.filter(isFav); }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(s) { if (!isFinite(s)) return "0:00"; var m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ":" + (r < 10 ? "0" : "") + r; }

  /* cover art: use t.cover if you add an image link, otherwise a coloured tile */
  function cover(i, cls) {
    var t = TRACKS[i];
    if (t.cover) return '<div class="cv ' + cls + '" style="background-image:url(\'' + esc(t.cover) + '\')"></div>';
    var h = (i * 53 + 160) % 360;
    return '<div class="cv ' + cls + '" style="background:linear-gradient(135deg,hsl(' + h + ' 55% 38%),hsl(' + ((h + 40) % 360) + ' 60% 20%))"><span>' + esc(t.title.charAt(0).toUpperCase()) + '</span></div>';
  }
  function heartSvg(on) { return '<svg viewBox="0 0 24 24"><path d="' + (on ? HEART : HEART_O) + '"/></svg>'; }

  var lists = { "list-home": ALL, "list-search": [], "list-fav": [] };
  function renderList(id, arr, emptyMsg) {
    lists[id] = arr;
    var ul = $(id);
    if (!arr.length) { ul.innerHTML = '<li class="empty">' + emptyMsg + '</li>'; return; }
    ul.innerHTML = arr.map(function (i) {
      var t = TRACKS[i];
      return '<li class="row' + (i === cur ? " active" : "") + '" data-i="' + i + '" tabindex="0">' + cover(i, "") +
        '<div class="t"><b>' + esc(t.title) + '</b><span>' + esc(t.artist) + '</span></div>' +
        '<button class="fav' + (isFav(i) ? " on" : "") + '" data-fav="' + i + '" aria-label="Favorite">' + heartSvg(isFav(i)) + '</button></li>';
    }).join("");
  }
  function renderAll() {
    var q = $("q").value.trim().toLowerCase();
    renderList("list-home", ALL, "");
    renderList("list-search", ALL.filter(function (i) { return !q || (TRACKS[i].title + " " + TRACKS[i].artist).toLowerCase().indexOf(q) !== -1; }), "No songs found.");
    renderList("list-fav", favIndexes(), "No favorites yet. Tap the heart on a song to add it here.");
    $("heroCount").textContent = TRACKS.length + " songs";
    $("favCount").textContent = favIndexes().length;
    $("pfav").className = "fav" + (isFav(cur) ? " on" : "");
    $("pfav").innerHTML = heartSvg(isFav(cur));
  }

  /* ---- navigation ---- */
  function show(name) {
    if (name === "player" && tab !== "player") prevTab = tab;
    tab = name;
    ["home", "search", "fav", "player"].forEach(function (n) { $("v-" + n).hidden = n !== name; });
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
      if (b.dataset.tab === name) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    $("ttl").textContent = TITLES[name];
    $("back").hidden = name !== "player";
    $("hsearch").hidden = name !== "home";
    $("mini").style.display = name === "player" ? "none" : "";
    $("main").scrollTop = 0;
    if (name === "search") setTimeout(function () { $("q").focus(); }, 50);
  }

  /* ---- playback ---- */
  function setIcon(on) {
    Array.prototype.forEach.call(document.querySelectorAll(".ic"), function (p) { p.setAttribute("d", on ? PAUSE : PLAY); });
    $("toggle").setAttribute("aria-label", on ? "Pause" : "Play");
    $("mtoggle").setAttribute("aria-label", on ? "Pause" : "Play");
  }
  function toast(msg) { var t = $("toast"); t.textContent = msg || ""; t.hidden = !msg; }
  function missingMsg() { return "Please Check Your Internet Connection!"; }

  function play(i, q, auto) {
    if (q) queue = q.slice();
    if (queue.indexOf(i) === -1) queue = ALL.slice();
    cur = i;
    var t = TRACKS[i];
    toast("");
    audio.src = t.src;
    $("ptitle").textContent = t.title; $("partist").textContent = t.artist;
    $("mtitle").textContent = t.title; $("martist").textContent = t.artist;
    $("bigcover").innerHTML = cover(i, "big"); $("mcover").innerHTML = cover(i, "mini");
    $("seek").value = 0; $("cur").textContent = "0:00"; $("dur").textContent = "0:00"; $("mbar").style.width = "0";
    if ("mediaSession" in navigator && window.MediaMetadata) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: "Tr Craze Music" });
    }
    renderAll();
    if (auto) started = true;
    if (auto) audio.play().catch(function (e) {
      if (!e || e.name === "AbortError") return;
      toast(e.name === "NotSupportedError" ? missingMsg() : "Could not play: " + e.name);
    });
  }
  function step(dir) {
    var pos = queue.indexOf(cur);
    if (shuffle && dir > 0 && queue.length > 1) {
      var n; do { n = queue[Math.floor(Math.random() * queue.length)]; } while (n === cur);
      return n;
    }
    return queue[(pos + dir + queue.length) % queue.length];
  }
  function next() { play(step(1), null, true); }
  function prev() { if (audio.currentTime > 3) audio.currentTime = 0; else play(step(-1), null, true); }
  function toggle() { started = true; if (audio.paused) audio.play().catch(function () {}); else audio.pause(); }

  /* ---- events ---- */
  function listClick(e) {
    var fav = e.target.closest("[data-fav]");
    if (fav) { e.stopPropagation(); toggleFav(+fav.dataset.fav); return; }
    var row = e.target.closest(".row");
    if (row) play(+row.dataset.i, lists[this.id], true);
  }
  ["list-home", "list-search", "list-fav"].forEach(function (id) {
    var ul = $(id);
    ul.addEventListener("click", listClick);
    ul.addEventListener("keydown", function (e) {
      if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("row")) { e.preventDefault(); play(+e.target.dataset.i, lists[id], true); }
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) { b.addEventListener("click", function () { show(b.dataset.tab); }); });
  $("back").addEventListener("click", function () { show(prevTab); });
  $("hsearch").addEventListener("click", function () { show("search"); });
  $("goFav").addEventListener("click", function () { show("fav"); });
  $("q").addEventListener("input", renderAll);
  $("playAll").addEventListener("click", function () { shuffle = false; syncModes(); play(0, ALL, true); });
  $("shuffleAll").addEventListener("click", function () { shuffle = true; syncModes(); play(ALL[Math.floor(Math.random() * ALL.length)], ALL, true); });
  $("mini").addEventListener("click", function (e) { if (!e.target.closest("button")) show("player"); });
  ["toggle", "mtoggle"].forEach(function (id) { $(id).addEventListener("click", toggle); });
  ["next", "mnext"].forEach(function (id) { $(id).addEventListener("click", next); });
  ["prev", "mprev"].forEach(function (id) { $(id).addEventListener("click", prev); });
  $("pfav").addEventListener("click", function () { toggleFav(cur); });
  function syncModes() {
    $("shuf").className = "sm" + (shuffle ? " on" : "");
    $("rep").className = "sm rep" + (repeat !== "all" ? " on" : "") + (repeat === "one" ? " one" : "");
    $("shuf").setAttribute("aria-pressed", shuffle);
  }
  $("shuf").addEventListener("click", function () { shuffle = !shuffle; syncModes(); });
  $("rep").addEventListener("click", function () { repeat = repeat === "all" ? "one" : "all"; syncModes(); });
  $("seek").addEventListener("input", function () { if (audio.duration) audio.currentTime = ($("seek").value / 100) * audio.duration; });

  audio.addEventListener("play", function () { setIcon(true); });
  audio.addEventListener("pause", function () { setIcon(false); });
  audio.addEventListener("ended", function () { if (repeat === "one") { audio.currentTime = 0; audio.play(); } else next(); });
  audio.addEventListener("loadedmetadata", function () { $("dur").textContent = fmt(audio.duration); });
  audio.addEventListener("timeupdate", function () {
    $("cur").textContent = fmt(audio.currentTime);
    if (audio.duration) { var p = (audio.currentTime / audio.duration) * 100; $("seek").value = p; $("mbar").style.width = p + "%"; }
  });
  audio.addEventListener("error", function () { setIcon(false); if (started) toast(missingMsg()); });

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("previoustrack", prev);
    navigator.mediaSession.setActionHandler("nexttrack", next);
  }

  audio.volume = 0.8;
  syncModes();
  play(0, ALL, false);
  show("home");
</script>
</body>
</html>
